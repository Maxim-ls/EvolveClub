name: Beget Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check SSH secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || (echo "::error::SSH_PRIVATE_KEY is empty" && exit 1)

      - name: Install SSH deploy tools
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client

      - name: Deploy to Beget
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: evolveclub.beget.tech
          SSH_PORT: 22
          SSH_USERNAME: evolveclub_2026
          SSH_TARGET_DIR: /home/e/evolveclub/evolveclub/public_html
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/beget_deploy_key
          chmod 600 ~/.ssh/beget_deploy_key
          ssh-keygen -y -f ~/.ssh/beget_deploy_key > ~/.ssh/beget_deploy_key.pub
          ssh-keygen -lf ~/.ssh/beget_deploy_key.pub
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

          SSH_COMMAND="ssh -i ~/.ssh/beget_deploy_key -p $SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes"
          $SSH_COMMAND "$SSH_USERNAME@$SSH_HOST" "mkdir -p '$SSH_TARGET_DIR'"
          rsync -rz --delete --checksum --itemize-changes \
            -e "$SSH_COMMAND" \
            ./_site/ "$SSH_USERNAME@$SSH_HOST:$SSH_TARGET_DIR/"
