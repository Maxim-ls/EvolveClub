name: Beget Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check SSH secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          test -n "$SSH_HOST" || (echo "::error::SSH_HOST is empty" && exit 1)
          test -n "$SSH_PORT" || (echo "::error::SSH_PORT is empty" && exit 1)
          test -n "$SSH_USERNAME" || (echo "::error::SSH_USERNAME is empty" && exit 1)
          test -n "$SSH_PRIVATE_KEY" || (echo "::error::SSH_PRIVATE_KEY is empty" && exit 1)
          test -n "$SSH_TARGET_DIR" || (echo "::error::SSH_TARGET_DIR is empty" && exit 1)

      - name: Install SSH deploy tools
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client

      - name: Deploy to Beget
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/beget_deploy_key
          chmod 600 ~/.ssh/beget_deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/beget_deploy_key -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" "mkdir -p '$SSH_TARGET_DIR'"
          rsync -rz --delete --checksum --itemize-changes \
            -e "ssh -i ~/.ssh/beget_deploy_key -p $SSH_PORT" \
            ./_site/ "$SSH_USERNAME@$SSH_HOST:$SSH_TARGET_DIR/"
