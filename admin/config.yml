backend:
  name: github
  repo: Tetrr31/EvolveClub
  branch: main
  base_url: https://tijayvpn.site
  auth_endpoint: admin/auth/auth.php

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

locale: "ru"

collections:
  - name: "settings"
    label: "Настройки"
    files:
      - name: "home_images"
        label: "Главная: изображения"
        file: "_data/homeImages.json"
        fields:
          - { label: "Главный фон первого экрана", name: "hero", widget: "image" }
          - label: "Карточки обзора направлений"
            name: "overview"
            widget: "object"
            fields:
              - { label: "Европа", name: "europe", widget: "image" }
              - { label: "Россия и СНГ", name: "russiaCis", widget: "image" }
              - { label: "Азия и Восток", name: "asiaEast", widget: "image" }
              - { label: "Африка", name: "africa", widget: "image" }
              - { label: "Америка и Карибы", name: "americaCaribbean", widget: "image" }
              - { label: "Острова", name: "islands", widget: "image" }
              - { label: "Австралия и Океания", name: "oceania", widget: "image" }
          - label: "Фоны разделов направлений"
            name: "directions"
            widget: "object"
            fields:
              - { label: "Европа", name: "europeBg", widget: "image" }
              - { label: "Россия и СНГ", name: "russiaCisBg", widget: "image" }
              - { label: "Азия и Восток", name: "asiaEastBg", widget: "image" }
              - { label: "Африка", name: "africaBg", widget: "image" }
              - { label: "Америка и Карибы", name: "americaCaribbeanBg", widget: "image" }
              - { label: "Острова", name: "islandsBg", widget: "image" }
              - { label: "Австралия и Океания", name: "oceaniaBg", widget: "image" }
          - label: "Карточки стран внутри направлений"
            name: "directionCards"
            widget: "object"
            fields:
              - { label: "Франция", name: "france", widget: "image" }
              - { label: "Испания", name: "spain", widget: "image" }
              - { label: "Италия", name: "italy", widget: "image" }
              - { label: "Исландия", name: "iceland", widget: "image" }
              - { label: "Россия", name: "russia", widget: "image" }
              - { label: "Армения", name: "armenia", widget: "image" }
              - { label: "Узбекистан", name: "uzbekistan", widget: "image" }
              - { label: "Китай", name: "china", widget: "image" }
              - { label: "Таиланд", name: "thailand", widget: "image" }
              - { label: "Индонезия", name: "indonesia", widget: "image" }
              - { label: "Вьетнам", name: "vietnam", widget: "image" }
              - { label: "Япония", name: "japan", widget: "image" }
              - { label: "Турция", name: "turkey", widget: "image" }
              - { label: "Египет", name: "egypt", widget: "image" }
              - { label: "Марокко", name: "morocco", widget: "image" }
              - { label: "Занзибар", name: "zanzibar", widget: "image" }
              - { label: "ЮАР", name: "southAfrica", widget: "image" }
              - { label: "США", name: "usa", widget: "image" }
              - { label: "Мексика", name: "mexico", widget: "image" }
              - { label: "Бразилия", name: "brazil", widget: "image" }
              - { label: "Австралия", name: "australia", widget: "image" }
              - { label: "Новая Зеландия", name: "newZealand", widget: "image" }
          - { label: "Фон формы запроса", name: "request", widget: "image" }
      - name: "segments"
        label: "Сегменты отелей"
        file: "_data/segments.json"
        fields:
          - label: "Сегменты"
            name: "segments"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Название", name: "label", widget: "string" }
              - { label: "Код", name: "value", widget: "string", hint: "Латиницей, например luxury или family" }

  - name: "countries"
    label: "Направления"
    label_singular: "Направление"
    folder: "content/countries"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}}"
    sortable_fields: ["order", "title", "published", "featured"]
    view_filters:
      - label: "Европа"
        field: "region"
        pattern: "europe"
      - label: "Россия и СНГ"
        field: "region"
        pattern: "russia-cis"
      - label: "Азия и Восток"
        field: "region"
        pattern: "asia-east"
      - label: "Африка"
        field: "region"
        pattern: "africa"
      - label: "Америка и Карибы"
        field: "region"
        pattern: "america-caribbean"
      - label: "Острова"
        field: "region"
        pattern: "islands"
      - label: "Австралия и Океания"
        field: "region"
        pattern: "oceania"
      - label: "Опубликованные"
        field: "published"
        pattern: true
      - label: "Черновики"
        field: "published"
        pattern: false
      - label: "На главной"
        field: "featured"
        pattern: true
    fields:
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Адрес страницы", name: "slug", widget: "string", hint: "Латиницей, без пробелов. Например: maldives" }
      - label: "Раздел на главной"
        name: "region"
        widget: "select"
        default: "islands"
        options:
          - { label: "Европа", value: "europe" }
          - { label: "Россия и СНГ", value: "russia-cis" }
          - { label: "Азия и Восток", value: "asia-east" }
          - { label: "Африка", value: "africa" }
          - { label: "Америка и Карибы", value: "america-caribbean" }
          - { label: "Острова", value: "islands" }
          - { label: "Австралия и Океания", value: "oceania" }
      - { label: "Краткое описание", name: "subtitle", widget: "text" }
      - { label: "Обложка", name: "cover", widget: "image", hint: "Горизонтальное изображение для фона страницы" }
      - { label: "Кнопка «Зачем ехать»: заголовок", name: "why_title", widget: "string", required: false, default: "Зачем ехать?" }
      - { label: "Кнопка «Зачем ехать»: текст", name: "why_body", widget: "markdown", required: false }
      - { label: "Кнопка «Подробнее»: заголовок", name: "details_title", widget: "string", required: false, default: "Подробнее" }
      - { label: "Кнопка «Подробнее»: текст", name: "details_body", widget: "markdown", required: false }
      - { label: "Порядок", name: "order", widget: "number", default: 1 }
      - { label: "Опубликовано", name: "published", widget: "boolean", default: true }
      - { label: "Показывать", name: "featured", widget: "boolean", default: true }
      - { label: "Тег", name: "tags", widget: "hidden", default: "country" }
      - { label: "Описание", name: "body", widget: "markdown" }

  - name: "hotels"
    label: "Отели"
    label_singular: "Отель"
    folder: "content/hotels"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} · {{country}}"
    sortable_fields: ["order", "title", "country", "published", "featured"]
    view_filters:
      - label: "Мальдивы"
        field: "country"
        pattern: "maldives"
      - label: "Маврикий"
        field: "country"
        pattern: "mauritius"
      - label: "Сейшелы"
        field: "country"
        pattern: "seychelles"
      - label: "Опубликованные"
        field: "published"
        pattern: true
      - label: "Черновики"
        field: "published"
        pattern: false
    fields:
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Адрес страницы", name: "slug", widget: "string", hint: "Латиницей, без пробелов. Например: waldorf-astoria-ithaafushi" }
      - label: "Страна"
        name: "country"
        widget: "relation"
        collection: "countries"
        search_fields: ["title", "slug"]
        value_field: "slug"
        display_fields: ["title"]
      - label: "Сегмент"
        name: "tier"
        widget: "select"
        default: "deluxe"
        options:
          - { label: "Deluxe", value: "deluxe" }
          - { label: "Premium", value: "premium" }
          - { label: "Business", value: "business" }
      - label: "Звезды"
        name: "stars"
        widget: "select"
        default: "★★★★★"
        options:
          - { label: "2 звезды", value: "★★" }
          - { label: "3 звезды", value: "★★★" }
          - { label: "4 звезды", value: "★★★★" }
          - { label: "5 звезд", value: "★★★★★" }
      - { label: "Расположение", name: "location", widget: "string", required: false, hint: "Например: South Male Atoll, Праслин, Маэ" }
      - { label: "Краткое описание", name: "subtitle", widget: "text" }
      - { label: "Обложка", name: "cover", widget: "image", hint: "Горизонтальное изображение для фона страницы и карточки отеля" }
      - label: "Галерея"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Фото", name: "image", widget: "image", hint: "Горизонтальное фото, желательно не тяжелее 1-2 МБ" }
      - { label: "Заголовок описания", name: "about_title", widget: "string", required: false, hint: "Если не заполнить, будет использовано краткое описание" }
      - { label: "Описание", name: "body", widget: "markdown" }
      - label: "Факты в первом блоке"
        name: "facts"
        widget: "list"
        required: false
        summary: "{{fields.label}}"
        fields:
          - { label: "Заголовок", name: "label", widget: "string", hint: "Например: Адрес, Телефон, Трансфер, Формат" }
          - { label: "Текст", name: "text", widget: "text" }
      - { label: "Заголовок блока размещения", name: "rooms_title", widget: "string", required: false, default: "Варианты номеров и вилл" }
      - { label: "Описание блока размещения", name: "rooms_intro", widget: "text", required: false }
      - label: "Номера, сьюты и виллы"
        name: "rooms"
        widget: "list"
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: "Название", name: "title", widget: "string" }
          - { label: "Тип / категория", name: "type", widget: "string", required: false, hint: "Например: номер, сьют, Beach Villa, Overwater Villa, Residence" }
          - { label: "Краткое описание", name: "description", widget: "text" }
          - { label: "Площадь", name: "area", widget: "string", required: false }
          - { label: "Размещение", name: "capacity", widget: "string", required: false }
          - label: "Фото номера, сьюта или виллы"
            name: "images"
            widget: "list"
            required: false
            field: { label: "Фото", name: "image", widget: "image", hint: "Фото интерьера, номера, сьюта или виллы, желательно не тяжелее 1-2 МБ" }
      - { label: "Порядок", name: "order", widget: "number", default: 1 }
      - { label: "Опубликовано", name: "published", widget: "boolean", default: true }
      - { label: "Показывать", name: "featured", widget: "boolean", default: true }
      - { label: "Тег", name: "tags", widget: "hidden", default: "hotel" }

  - name: "tours"
    label: "Туры"
    label_singular: "Тур"
    folder: "content/tours"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} · {{destination}}"
    sortable_fields: ["order", "title", "destination", "published", "featured"]
    fields:
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Адрес страницы", name: "slug", widget: "string", hint: "Латиницей, без пробелов. Например: classic-japan-two-weeks" }
      - { label: "Направление", name: "destination", widget: "string" }
      - { label: "Длительность", name: "duration", widget: "string", required: false }
      - { label: "Краткое описание", name: "subtitle", widget: "text" }
      - { label: "Обложка", name: "cover", widget: "image", hint: "Горизонтальное изображение для фона страницы и карточки тура" }
      - { label: "Заголовок вводного блока", name: "intro_title", widget: "string", required: false }
      - { label: "Картинка вводного блока", name: "intro_image", widget: "image", required: false }
      - label: "Коротко о туре"
        name: "hero_facts"
        widget: "list"
        required: false
        summary: "{{fields.label}}"
        fields:
          - { label: "Заголовок", name: "label", widget: "string", hint: "Например: Проживание, Питание, Переезды" }
          - { label: "Текст", name: "text", widget: "text" }
      - { label: "Заголовок маршрута", name: "route_title", widget: "string", required: false }
      - label: "Линия маршрута"
        name: "route"
        widget: "list"
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: "Точка маршрута", name: "title", widget: "string" }
      - { label: "Заголовок программы", name: "program_title", widget: "string", required: false }
      - label: "Программа по дням"
        name: "days"
        widget: "list"
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: "День и город", name: "title", widget: "string", hint: "Например: 1 день · Токио" }
          - { label: "Описание дня", name: "description", widget: "text" }
          - { label: "Отель", name: "hotel", widget: "string", required: false }
          - { label: "Питание", name: "meals", widget: "string", required: false }
          - { label: "Фото дня", name: "image", widget: "image", required: false }
          - { label: "Alt для фото", name: "image_alt", widget: "string", required: false }
      - label: "Инфо-разделы"
        name: "info_sections"
        widget: "list"
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: "Заголовок", name: "title", widget: "string" }
          - label: "Пункты"
            name: "items"
            widget: "list"
            required: false
            field: { label: "Текст", name: "text", widget: "text" }
          - { label: "Текст без списка", name: "body", widget: "text", required: false }
      - { label: "Финальный блок: заголовок", name: "fit_title", widget: "string", required: false }
      - { label: "Финальный блок: текст", name: "fit_body", widget: "text", required: false }
      - { label: "Текст в модальном окне заявки", name: "request_lead", widget: "text", required: false }
      - label: "Галерея"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Фото", name: "image", widget: "image", hint: "Горизонтальное фото, желательно не тяжелее 1-2 МБ" }
      - { label: "Порядок", name: "order", widget: "number", default: 1 }
      - { label: "Опубликовано", name: "published", widget: "boolean", default: true }
      - { label: "Показывать", name: "featured", widget: "boolean", default: true }
      - { label: "Тег", name: "tags", widget: "hidden", default: "tour" }
      - { label: "Описание", name: "body", widget: "markdown" }
